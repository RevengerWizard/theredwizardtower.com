# Projects
[[params.projects]]
name = "Teascript"
title = "teascript"
year = 2022
description = """
A small bytecode interpreter for a dynamically typed language.

Featuring a stack-based VM, minimal core library, and a small, clean C API.

Website: [teascript.org](https://teascript.org)
"""
url = "https://github.com/RevengerWizard/teascript"

[[params.projects]]
name = "Viper"
title = "viper"
year = 2025
description = """
A compiler written in C with no dependencies for a statically compiled language.

Generates TAC IR and lowers to x64 machine code.
"""
url = "https://github.com/RevengerWizard/viper"

[[params.projects]]
name = "Micro"
